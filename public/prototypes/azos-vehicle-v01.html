<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZOS Vehicle Intelligence</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202123}button,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#f7f7f8;border-right:1px solid #e5e7eb;padding:18px 14px;display:flex;flex-direction:column;gap:16px}.brand{font-weight:650;padding:4px 8px 10px}.brand span{color:#6b6f76;font-weight:450}.side button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px}.side .active,.side .selected{background:#e9ecef}.switch{margin-top:auto;border-top:1px solid #e5e7eb;padding-top:12px}.switch small{display:block;color:#777;padding:0 10px 6px}.main{min-width:0}.top{height:66px;border-bottom:1px solid #e5e7eb;padding:10px 22px;display:flex;justify-content:space-between;align-items:center}.top small{display:block;color:#6b6f76;margin-top:3px}.ghost{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 11px}.chat{width:min(760px,calc(100% - 36px));margin:auto;padding:34px 0 170px}.status{display:inline-block;border:1px solid #e5e7eb;background:#fafafa;border-radius:999px;padding:7px 10px;color:#666;font-size:13px;margin-bottom:30px}.m{display:grid;grid-template-columns:30px 1fr;gap:12px;margin-bottom:28px}.av{width:28px;height:28px;border-radius:8px;background:#eef1f3;display:grid;place-items:center;font-size:12px;font-weight:700}.txt{line-height:1.62;font-size:16px;white-space:pre-wrap}.composeWrap{position:fixed;left:250px;right:0;bottom:0;padding:18px 22px 12px;background:linear-gradient(to top,#fff 72%,rgba(255,255,255,0))}.compose{width:min(760px,calc(100% - 36px));margin:auto;border:1px solid #d8dade;border-radius:18px;background:#fff;box-shadow:0 6px 24px #00000012;padding:10px}.compose textarea{border:0;outline:0;resize:none;width:100%;min-height:48px;font-size:16px}.actions{display:flex;justify-content:space-between}.send{border:0;width:34px;height:34px;border-radius:50%;background:#26282c;color:#fff;font-size:20px}.icon{border:0;background:transparent;font-size:18px}.hint{text-align:center;color:#999;font-size:11px;margin-top:7px}.drawer{position:fixed;right:20px;top:80px;width:250px;border:1px solid #ddd;background:#fff;border-radius:12px;padding:14px;display:none}.drawer.open{display:block}.drawer div{margin:7px 0;font-size:13px}.drawer span{color:#666}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.composeWrap{left:0;padding:10px 8px}.chat,.compose{width:calc(100% - 16px)}.top{padding:10px 14px}.drawer{left:10px;right:10px;width:auto}}
</style>
<div class="app"><aside class="side"><div class="brand">AZOS <span>Vehicle Intelligence</span></div><button id="reset">＋ New conversation</button><button class="active">Harrier — front knocking</button><button>Needs your attention · 1</button><button>My vehicles</button><div class="switch"><small>TEST AS</small><button id="owner" class="selected">Owner</button><button id="garage">Garage</button></div></aside><main class="main"><div class="top"><div><strong>Toyota Harrier</strong><small>UAX 482K · Vehicle case open</small></div><button class="ghost" id="view">View vehicle</button></div><div class="chat"><div class="status" id="status">Understand the front knocking</div><div id="messages"></div></div><div class="composeWrap"><div class="compose"><textarea id="input" placeholder="Tell AZOS what you need"></textarea><div class="actions"><div><button class="icon">＋</button><button class="icon">◉</button></div><button class="send" id="send">↑</button></div></div><div class="hint">Enter to send · Shift+Enter for a new line</div></div></main></div>
<div class="drawer" id="drawer"><strong>Vehicle intelligence</strong><div>Issue: <span id="issue">Not yet described</span></div><div>Findings: <span id="findings">None yet</span></div><div>Quote: <span id="quote">—</span></div><div>Authorized: <span id="auth">—</span></div><div>Outcome: <span id="outcome">Open</span></div></div>
<script>
const q=id=>document.getElementById(id);
const defaultState={issue:"",findings:[],recommendation:"",quote:null,authorized:null,additionalIssues:[],repairComplete:false,outcome:"",unresolved:["Understand the front knocking"]};
let role=localStorage.getItem("azos-role")||"owner";
let state=JSON.parse(localStorage.getItem("azos-vehicle-state")||"null")||structuredClone(defaultState);
let chats=JSON.parse(localStorage.getItem("azos-vehicle-chats")||"null")||{
 owner:[["assistant","Hi Timothy. I’m looking after your Toyota Harrier. What’s happening with the car?"]],
 garage:[["assistant","You have one inspection request for a Toyota Harrier. The owner reports a knocking sound from the front over potholes. Tell me what you found when you checked it."]]
};
function save(){localStorage.setItem("azos-role",role);localStorage.setItem("azos-vehicle-state",JSON.stringify(state));localStorage.setItem("azos-vehicle-chats",JSON.stringify(chats))}
function money(n){return "UGX "+Number(n).toLocaleString("en-US")}
function attention(){return state.unresolved?.[0]||state.additionalIssues?.[0]||"Nothing needs your attention"}
function render(){
 q("messages").innerHTML="";
 for(const [r,t] of chats[role]||[]){const d=document.createElement("div");d.className="m";d.innerHTML='<div class="av">'+(r==="assistant"?"A":role==="owner"?"T":"G")+'</div><div class="txt"></div>';d.querySelector(".txt").textContent=t;q("messages").appendChild(d)}
 q("status").textContent=attention();
 q("input").placeholder=role==="owner"?"Tell AZOS what you need":"Tell AZOS what you found or what changed";
 q("issue").textContent=state.issue||"Not yet described";
 q("findings").textContent=state.findings?.length?state.findings.map(x=>typeof x==="string"?x:x.text).join("; "):"None yet";
 q("quote").textContent=state.quote?.amount?money(state.quote.amount)+" · v"+state.quote.version:"—";
 q("auth").textContent=state.authorized?.amount?money(state.authorized.amount):"—";
 q("outcome").textContent=state.outcome||"Open";
 q("owner").classList.toggle("selected",role==="owner");q("garage").classList.toggle("selected",role==="garage");
}
function apply(actions,sourceText){
 for(const a of actions||[]){
  if(a.type==="set_issue"&&typeof a.value==="string") state.issue=a.value;
  if(a.type==="add_finding"&&typeof a.value==="string"){
    state.findings=state.findings||[];
    state.findings.push({text:a.value,sourceRole:role,sourceText,at:new Date().toISOString()});
  }
  if(a.type==="set_recommendation"&&typeof a.value==="string") state.recommendation=a.value;
  if(a.type==="set_quote"&&Number.isFinite(Number(a.amount))){
    state.quote={amount:Number(a.amount),detail:a.detail||"",version:(state.quote?.version||0)+1};
  }
  if(a.type==="set_authorized"&&role==="owner"&&Number.isFinite(Number(a.amount))){
    state.authorized={amount:Number(a.amount),scope:a.scope||""};
  }
  if(a.type==="add_additional_issue"&&typeof a.value==="string"){
    state.additionalIssues=state.additionalIssues||[]; if(!state.additionalIssues.includes(a.value)) state.additionalIssues.push(a.value);
  }
  if(a.type==="set_repair_complete") state.repairComplete=!!a.value;
  if(a.type==="set_outcome"&&role==="owner"&&typeof a.value==="string") state.outcome=a.value;
  if(a.type==="set_unresolved"&&Array.isArray(a.items)) state.unresolved=a.items.filter(x=>typeof x==="string");
 }
}
async function send(){
 const input=q("input"),text=input.value.trim(); if(!text||q("send").disabled)return;
 chats[role].push(["user",text]); input.value=""; q("send").disabled=true; q("send").textContent="…"; save(); render();
 try{
   const history=(chats[role]||[]).slice(-12).map(([r,t])=>({role:r==="assistant"?"assistant":"user",text:t}));
   const res=await fetch("/api/vehicle-chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role,message:text,state,history})});
   const data=await res.json();
   if(!res.ok) throw new Error(data.error||"AZOS could not respond.");
   apply(data.actions,text);
   chats[role].push(["assistant",data.reply||"I’ve updated the case."]);
 }catch(e){
   chats[role].push(["assistant","I couldn’t use the live reasoning service for that turn. "+(e?.message||"Please try again.")]);
 }finally{
   q("send").disabled=false;q("send").textContent="↑";save();render();input.focus();
 }
}
q("send").onclick=send;
q("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
q("owner").onclick=()=>{role="owner";save();render()};
q("garage").onclick=()=>{role="garage";save();render()};
q("reset").onclick=()=>{state=structuredClone(defaultState);chats={owner:[["assistant","Hi Timothy. I’m looking after your Toyota Harrier. What’s happening with the car?"]],garage:[["assistant","You have one inspection request for a Toyota Harrier. The owner reports a knocking sound from the front over potholes. Tell me what you found when you checked it."]]};save();render()};
q("view").onclick=()=>q("drawer").classList.toggle("open");
render();
</script>
