<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZOS Vehicle Intelligence</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202123}button,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#f7f7f8;border-right:1px solid #e5e7eb;padding:18px 14px;display:flex;flex-direction:column;gap:16px}.brand{font-weight:650;padding:4px 8px 10px}.brand span{color:#6b6f76;font-weight:450}.side button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px}.side .active,.side .selected{background:#e9ecef}.switch{margin-top:auto;border-top:1px solid #e5e7eb;padding-top:12px}.switch small{display:block;color:#777;padding:0 10px 6px}.main{min-width:0}.top{height:66px;border-bottom:1px solid #e5e7eb;padding:10px 22px;display:flex;justify-content:space-between;align-items:center}.top small{display:block;color:#6b6f76;margin-top:3px}.ghost{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 11px}.chat{width:min(760px,calc(100% - 36px));margin:auto;padding:34px 0 170px}.status{display:inline-block;border:1px solid #e5e7eb;background:#fafafa;border-radius:999px;padding:7px 10px;color:#666;font-size:13px;margin-bottom:30px}.m{display:grid;grid-template-columns:30px 1fr;gap:12px;margin-bottom:28px}.av{width:28px;height:28px;border-radius:8px;background:#eef1f3;display:grid;place-items:center;font-size:12px;font-weight:700}.txt{line-height:1.62;font-size:16px;white-space:pre-wrap}.composeWrap{position:fixed;left:250px;right:0;bottom:0;padding:18px 22px 12px;background:linear-gradient(to top,#fff 72%,rgba(255,255,255,0))}.compose{width:min(760px,calc(100% - 36px));margin:auto;border:1px solid #d8dade;border-radius:18px;background:#fff;box-shadow:0 6px 24px #00000012;padding:10px}.compose textarea{border:0;outline:0;resize:none;width:100%;min-height:48px;font-size:16px}.actions{display:flex;justify-content:space-between}.send{border:0;width:34px;height:34px;border-radius:50%;background:#26282c;color:#fff;font-size:20px}.icon{border:0;background:transparent;font-size:18px}.hint{text-align:center;color:#999;font-size:11px;margin-top:7px}.drawer{position:fixed;right:20px;top:80px;width:250px;border:1px solid #ddd;background:#fff;border-radius:12px;padding:14px;display:none}.drawer.open{display:block}.drawer div{margin:7px 0;font-size:13px}.drawer span{color:#666}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.composeWrap{left:0;padding:10px 8px}.chat,.compose{width:calc(100% - 16px)}.top{padding:10px 14px}.drawer{left:10px;right:10px;width:auto}}
</style>
<div class="app"><aside class="side"><div class="brand">AZOS <span>Vehicle Intelligence</span></div><button id="reset">＋ New conversation</button><button class="active">Harrier — front knocking</button><button>Needs your attention · 1</button><button>My vehicles</button><div class="switch"><small>TEST AS</small><button id="owner" class="selected">Owner</button><button id="garage">Garage</button></div></aside><main class="main"><div class="top"><div><strong>Toyota Harrier</strong><small>UAX 482K · Vehicle case open</small></div><button class="ghost" id="view">View vehicle</button></div><div class="chat"><div class="status" id="status">Understand the front knocking</div><div id="messages"></div></div><div class="composeWrap"><div class="compose"><textarea id="input" placeholder="Tell AZOS what you need"></textarea><div class="actions"><div><button class="icon">＋</button><button class="icon">◉</button></div><button class="send" id="send">↑</button></div></div><div class="hint">Enter to send · Shift+Enter for a new line</div></div></main></div>
<div class="drawer" id="drawer"><strong>Vehicle intelligence</strong><div>Issue: <span id="issue">Not yet described</span></div><div>Findings: <span id="findings">None yet</span></div><div>Quote: <span id="quote">—</span></div><div>Authorized: <span id="auth">—</span></div><div>Outcome: <span id="outcome">Open</span></div></div>
<script>
let role='owner',state={issue:'',findings:[],unresolved:['Understand the front knocking'],repairComplete:false};
const seeds={owner:[['assistant',"Hi Timothy. I’m looking after your Toyota Harrier. What’s happening with the car?"]],garage:[['assistant','You have one inspection request for a Toyota Harrier. The owner reports a knocking sound from the front over potholes. Tell me what you found when you checked it.']]};let chats={owner:structuredClone(seeds.owner),garage:structuredClone(seeds.garage)};const q=x=>document.getElementById(x),money=n=>'UGX '+n.toLocaleString('en-US');
function att(){return state.additionalIssue||state.unresolved[0]||'Nothing needs your attention'}function render(){q('messages').innerHTML='';for(const [r,t] of chats[role]){let d=document.createElement('div');d.className='m';d.innerHTML='<div class="av">'+(r==='assistant'?'A':role==='owner'?'T':'G')+'</div><div class="txt"></div>';d.querySelector('.txt').textContent=t;q('messages').appendChild(d)}q('status').textContent=att();q('input').placeholder=role==='owner'?'Tell AZOS what you need':'Tell AZOS what you found or what changed';q('issue').textContent=state.issue||'Not yet described';q('findings').textContent=state.findings.length?state.findings.join('; '):'None yet';q('quote').textContent=state.quote?money(state.quote):'—';q('auth').textContent=state.authorized?money(state.authorized):'—';q('outcome').textContent=state.outcome||'Open'}
function reply(text){let t=text.toLowerCase();if(role==='owner'){if(t.includes('knock')||t.includes('pothole')){state.issue=text;state.unresolved=['Physical inspection of front suspension'];return 'I understand. Because the noise happens over potholes, the next useful step is a physical check of the front suspension. I can send the problem and relevant vehicle history to the garage without sharing your private conversation.'}if(t.includes('send')||t.includes('garage')||t.includes('inspect'))return 'Done. I’ve prepared the inspection request for the garage. You don’t need to do anything here until they respond.';if(t.includes('500'))return 'I can ask for UGX 500,000 while keeping the same repair scope and 555 parts.';if(t.includes('approve')||t.includes('550')){state.authorized=550000;state.unresolved=['Approved repair must be completed and verified'];return 'Confirmed: both lower-arm bushes, 555 parts, total UGX 550,000. Anything else will need your approval first.'}if(t.includes('gone')||t.includes('resolved')){state.outcome='Original knocking resolved';state.unresolved=state.additionalIssue?[state.additionalIssue]:[];return 'Good. I’ve recorded that the original knocking is resolved. The deferred CV boot remains open.'}return 'Tell me what you want to do next. I’ll keep unfinished items in context.'}
if((t.includes('bush')||t.includes('play'))&&(t.includes('left')||t.includes('right'))){state.findings=['Right lower-arm bush: excessive play reported','Left lower-arm bush: cracked, less severe'];if(t.includes('link'))state.findings.push('Stabilizer links: no fault reported');if(t.includes('shock'))state.findings.push('Shocks: no fault reported');state.unresolved=['Garage recommendation for observed bush wear'];return 'This is what I understood:\n• '+state.findings.join('\n• ')+'\n\nWhat do you recommend should be done?'}if(t.includes('replace')&&t.includes('both')){state.unresolved=['Price for recommended repair'];return 'Understood: replace both lower-arm bushes. Why both rather than only the right one?'}if(t.includes('600')||t.includes('420')||t.includes('180')){state.quote=600000;state.unresolved=['Owner decision on quote'];return 'I have the quote as UGX 600,000: bushes UGX 420,000 and labour UGX 180,000. I’ll present it as the garage’s quote, not AZOS’s estimate.'}if(t.includes('550')){state.quote=550000;state.unresolved=['Owner decision on revised quote'];return 'Recorded: revised total UGX 550,000 with the same scope and 555 parts. The earlier quote remains in history.'}if(t.includes('cv')||t.includes('boot')){state.additionalIssue='CV boot torn — not yet authorized';state.unresolved=['Owner decision on additional CV boot work'];return 'I’ve added the torn CV boot as a new finding. It was not part of the approved suspension work, so don’t do it yet.'}if(t.includes('finished')||t.includes('done')){state.repairComplete=true;state.unresolved=['Owner outcome after repair'];return 'I’ve recorded the approved suspension repair as completed. I’ll keep the case open until the owner confirms whether the knocking is gone.'}if(t.includes('air')||t.includes('ac')){state.unresolved=['Suspension findings still required','Check reported AC cooling issue'];return 'I’ve added the AC cooling complaint separately. I still need what you found when checking the front knocking.'}return 'Tell me what you found, recommend, or what changed. I’ll structure it and keep unfinished work open.'}
function send(){let text=q('input').value.trim();if(!text)return;chats[role].push(['user',text],['assistant',reply(text)]);q('input').value='';render()}q('send').onclick=send;q('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};q('owner').onclick=()=>{role='owner';q('owner').classList.add('selected');q('garage').classList.remove('selected');render()};q('garage').onclick=()=>{role='garage';q('garage').classList.add('selected');q('owner').classList.remove('selected');render()};q('reset').onclick=()=>{state={issue:'',findings:[],unresolved:['Understand the front knocking'],repairComplete:false};chats={owner:structuredClone(seeds.owner),garage:structuredClone(seeds.garage)};render()};q('view').onclick=()=>q('drawer').classList.toggle('open');render();
</script>
